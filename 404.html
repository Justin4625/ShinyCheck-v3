<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ShinyCheck</title>
  <!-- Same preview as index.html: shared links like shinycheck.nl/sv land on this page. -->
  <meta name="description" content="Track your shiny Pokémon across 9 games, from Omega Ruby &amp; Alpha Sapphire to Legends: Z-A: a Shiny Dex, a hunt counter with real odds, and your own Shiny Wrapped.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ShinyCheck">
  <meta property="og:title" content="ShinyCheck — your shinies, all in one place">
  <meta property="og:description" content="Shiny Dex, hunt counter with odds, and your own Shiny Wrapped for 9 Pokémon games.">
  <meta property="og:url" content="https://shinycheck.nl/">
  <meta property="og:image" content="https://shinycheck.nl/icons/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ShinyCheck — Your shinies. All in one place. With shiny Charizard, Umbreon, Gengar and Greninja.">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    // GitHub Pages serves this page for any path it doesn't know (e.g. /sv). Send the
    // visitor to the app with the path as ?p=, which js/pages/router.js turns back into a clean URL.
    // On github.io the app lives one folder deep (/ShinyCheck-v3/).
    (function () {
      var keep = /\.github\.io$/.test(location.hostname) ? 1 : 0;
      var parts = location.pathname.split("/").filter(Boolean);
      var base = "/" + parts.slice(0, keep).map(function (p) { return p + "/"; }).join("");
      var rest = parts.slice(keep).join("/");
      location.replace(base + "?p=" + encodeURIComponent(rest) + location.hash);
    })();
  </script>
</head>
<body></body>
</html>
