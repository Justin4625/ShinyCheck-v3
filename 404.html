<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ShinyCheck</title>
  <script>
    // GitHub Pages serves this page for any path it doesn't know (e.g. /sv). Send the
    // visitor to the app with the path as ?p=, which app.js turns back into a clean URL.
    // On github.io the app lives one folder deep (/ShinyCheck-v3/).
    (function () {
      var keep = /\.github\.io$/.test(location.hostname) ? 1 : 0;
      var parts = location.pathname.split("/").filter(Boolean);
      var base = "/" + parts.slice(0, keep).map(function (p) { return p + "/"; }).join("");
      var rest = parts.slice(keep).join("/");
      location.replace(base + "?p=" + encodeURIComponent(rest) + location.hash);
    })();
  </script>
</head>
<body></body>
</html>
